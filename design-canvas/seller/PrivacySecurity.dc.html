<helmet>
<style>
*{box-sizing:border-box;}
body{margin:0;background:#F4F5F9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0F172A;}
a{color:#4F46E5;text-decoration:none;}
.scr{width:390px;min-height:100%;position:relative;padding-bottom:120px;background:#F4F5F9;}
.hdr{position:sticky;top:0;background:#fff;padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #F1F5F9;z-index:5;}
.icn-btn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#F8FAFC;color:#475569;flex-shrink:0;}
.h1{font-size:15px;font-weight:900;color:#1E293B;letter-spacing:-0.01em;margin:0;}
.sub{font-size:10px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
.bodywrap{padding:14px;display:flex;flex-direction:column;gap:12px;}
.card{background:#fff;border:1px solid #F1F5F9;border-radius:16px;padding:14px;}
.lbl{font-size:10px;font-weight:900;color:#94A3B8;text-transform:uppercase;letter-spacing:0.05em;}
.field-lbl{font-size:11px;font-weight:800;color:#334155;margin:0 0 6px;}
.input{height:44px;border-radius:11px;border:1px solid #E2E8F0;background:#fff;padding:0 12px;font-size:12px;font-weight:600;color:#0F172A;display:flex;align-items:center;}
.textarea{border-radius:11px;border:1px solid #E2E8F0;background:#fff;padding:10px 12px;font-size:12px;font-weight:600;color:#94A3B8;}
.btn-primary{height:44px;border-radius:12px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:#4F46E5;color:#fff;}
.btn-outline{height:44px;border-radius:12px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#334155;border:1px solid #E2E8F0;}
.btn-danger{height:44px;border-radius:12px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#E11D48;border:1px solid #FECDD3;}
.chip{padding:9px 13px;border-radius:11px;font-size:11px;font-weight:800;background:#fff;color:#64748B;border:1px solid #E2E8F0;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.chip-active{background:#4F46E5;color:#fff;border-color:#4F46E5;}
.badge{font-size:9px;font-weight:900;padding:3px 7px;border-radius:7px;text-transform:uppercase;letter-spacing:0.03em;display:inline-block;}
.i{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.switch{width:38px;height:22px;border-radius:11px;position:relative;flex-shrink:0;}
.switch-on{background:#4F46E5;}
.switch-off{background:#E2E8F0;}
.switch-dot{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.avatar{border-radius:50%;background:#EEF2FF;color:#4F46E5;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;}
.progress{height:6px;border-radius:3px;background:#F1F5F9;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;}
.divider{height:1px;background:#F8FAFC;}
.navbar{position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:24px;background:#5346E0;box-shadow:0 10px 30px rgba(83,70,224,.35);display:flex;align-items:center;justify-content:space-around;padding:0 6px;}
.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.75);width:44px;height:44px;border-radius:14px;}
.navitem.active{color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);}
.kpi{background:#fff;border:1px solid #F1F5F9;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.kpi-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
</style>
</helmet>

    <p class="field-lbl">PIN kodni tasdiqlang</p>
    <div style="display:flex;gap:8px;margin-bottom:14px;justify-content:center;"><div style="width:44px;height:52px;border-radius:10px;border:1.5px solid #E2E8F0;"></div><div style="width:44px;height:52px;border-radius:10px;border:1.5px solid #E2E8F0;"></div><div style="width:44px;height:52px;border-radius:10px;border:1.5px solid #E2E8F0;"></div><div style="width:44px;height:52px;border-radius:10px;border:1.5px solid #E2E8F0;"></div></div>
